<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog Post - Health Empire</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 700px; background: white; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 250px; font-family: inherit; }
        button { background-color: #2ecc71; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .note { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Create New Blog Post</h2>
    <form method="post">
        <label for="title">Post Title (শিরোনাম)</label>
        <input type="text" name="title" id="title" placeholder="e.g., 5 Morning Habits for Weight Loss" required>

        <label for="category">Category (বিভাগ)</label>
        <select name="category" id="category">
            <option value="Fitness">Fitness</option>
            <option value="Diet">Diet & Nutrition</option>
            <option value="Mental Health">Mental Health</option>
            <option value="Lifestyle">Lifestyle</option>
        </select>

        <label for="content">Post Content (এখানে পুরো আর্টিকেল লিখবে)</label>
        <textarea name="content" id="content" placeholder="HTML ট্যাগ যেমন <p>, <h2> ব্যবহার করে সুন্দর করে সাজিয়ে লিখতে পারো..." required></textarea>
        <div class="note">টিপস: প্যারাগ্রাফের জন্য &lt;p&gt;লেখা&lt;/p&gt; এবং সাব-হেডিংয়ের জন্য &lt;h3&gt;হেডিং&lt;/h3&gt; ব্যবহার করতে পারো।</div>

        <button type="submit">Publish Post 🚀</button>
    </form>
</div>

</body>
</html>
