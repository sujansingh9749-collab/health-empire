<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post['title'] }} - PureLife Health AI</title>
    
    <meta name="description" content="Read about {{ post['title'] }}. Clean health and fitness tips, diet plans, and wellness guides on PureLife Health AI.">
    <meta name="keywords" content="health tips, fitness, diet, {{ post['category'] }}, wellness blog">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="{{ post['title'] }} - PureLife Health AI">
    <meta property="og:description" content="Explore expert insights on {{ post['category'] }} and lifestyle management.">
    <meta property="og:type" content="article">
    
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f8f9fa; margin: 0; padding: 0; }
        .navbar { background-color: #007bff; padding: 15px; text-align: center; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #222; font-size: 2.2rem; margin-bottom: 10px; }
        .meta { color: #666; font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .category { background: #e3f2fd; color: #0d47a1; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .content { font-size: 1.1rem; color: #444; }
        .content h2, .content h3 { color: #222; margin-top: 30px; }
        .content p { margin-bottom: 20px; }
        .back-btn { display: inline-block; margin-top: 30px; color: #007bff; text-decoration: none; font-weight: bold; }
        .back-btn:hover { text-decoration: underline; }
        footer { text-align: center; margin-top: 50px; padding: 30px 20px; color: #666; font-size: 0.9rem; border-top: 1px solid #eee; background: #fff; }
        footer a { color: #666; text-decoration: none; margin: 0 10px; font-weight: 500; }
        footer a:hover { color: #007bff; text-decoration: underline; }
        .footer-links { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/blog">Blog</a>
</div>

<div class="container">
    <span class="category">{{ post['category'] }}</span>
    <h1>{{ post['title'] }}</h1>
    <div class="meta">Published on: {{ post['date_created'] }}</div>
    
    <div class="content">
        {{ post['content']|safe }}
    </div>

    <a href="/blog" class="back-btn">← Back to Blog</a>
</div>

<footer>
    <div class="footer-links">
        <a href="/privacy-policy">Privacy Policy</a> | 
        <a href="/about">About</a> | 
        <a href="/disclaimer">Disclaimer</a> | 
        <a href="/terms">Terms</a> | 
        <a href="/contact">Contact</a>
    </div>
    <p>© 2026 PureLife Health AI. All rights reserved.</p>
</footer>

</body>
</html>
